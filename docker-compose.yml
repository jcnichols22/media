services:
  # GLUETUN (ProtonVPN)

  gluetun:
    image: qmcgaw/gluetun@sha256:183c74263a07f4c931979140ac99ff4fbc44dcb1ca5b055856ef580b0fafdf1c
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PROTONVPN_USER}+pmp
      - OPENVPN_PASSWORD=${PROTONVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands,Sweden,Switzerland,Canada
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - FIREWALL_INPUT_PORTS=8080
      - DOT=off
      - HEALTH_TARGET_ADDRESS=1.1.1.1:443
      - HEALTH_VPN_DURATION_INITIAL=20s
      - TZ=${TZ}
    ports:
      - 8080:8080 # qBittorrent WebUI
    healthcheck:
      test: [ "CMD", "/gluetun-entrypoint", "healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    env_file:
      - ".env"
  # PROWLARR

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - /opt/appdata/prowlarr:/config
      - ${ARRPATH}Prowlarr/backup:/data/Backup
      - ${ARRPATH}qbittorrent/downloads:/data/downloads

    ports:
      - 9696:9696
    restart: unless-stopped
    env_file:
      - ".env"

  # FLARESOLVERR (Cloudflare bypass proxy for indexers)

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - /opt/appdata/flaresolverr:/config
    restart: unless-stopped
    env_file:
      - ".env"

  # PROFILARR (Sync arr custom formats/profiles)

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    hostname: profilarr
    ports:
      - 6868:6868
    volumes:
      - /opt/appdata/profilarr:/config
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    env_file:
      - ".env"

  # JELLYPLEX-WATCHED (Sync Jellyfin <-> Plex watch history)

  jellyplex-watched:
    image: ghcr.io/luigi311/jellyplex-watched:latest
    container_name: jellyplex-watched
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    restart: unless-stopped
    env_file:
      - ".env"

  # Bazarr

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    volumes:
      - /opt/appdata/bazarr:/config
      - ${ARRPATH}Sonarr/tvseries:/data/tvshows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/anime-tvshows
      - ${ARRPATH}Radarr/movies:/data/movies
      - ${ARRPATH}Radarr/anime-movies:/data/anime-movies
    ports:
      - 6767:6767
    restart: unless-stopped
    env_file:
      - ".env"

  # SONARR

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - /opt/appdata/sonarr:/config
      - ${ARRPATH}Sonarr/backup:/data/Backup
      - ${ARRPATH}Sonarr/tvseries:/data/tvshows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/anime-tvshows
      - ${ARRPATH}qbittorrent/downloads:/data/downloads
    ports:
      - 8989:8989
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    env_file:
      - ".env"

  # RADARR

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - /opt/appdata/radarr:/config
      - ${ARRPATH}Radarr/movies:/data/movies
      - ${ARRPATH}Radarr/anime-movies:/data/anime-movies
      - ${ARRPATH}Radarr/backup:/data/Backup
      - ${ARRPATH}qbittorrent/downloads:/data/downloads
      - ${ARRPATH}ARM/media/completed/movies:/arm-completed
    ports:
      - 7878:7878
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    env_file:
      - ".env"

  # JELLYFIN

  jellyfin:
    image: linuxserver/jellyfin@sha256:e93bc100c6da07bd058678e4b634e4e71031fe840227e2ed03a1104f032bebe8
    container_name: jellyfin
    ports:
      - "8096:8096/tcp" # Jellyfin web interface
      - "7359:7359/udp" # Network discovery
      - "1900:1900/udp" # DLNA port
    volumes:
      - /opt/appdata/jellyfin:/config
      - ${ARRPATH}Radarr/movies:/data/Movies
      - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
      - ${ARRPATH}Sonarr/tvseries:/data/TVShows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "992" # render group
      - "44" # video group
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.0.34 #optional
    env_file:
      - ".env"
    restart: unless-stopped

  # PLEX

  # plex:
  #   image: plexinc/pms-docker@sha256:8b5bcdf7b506fe051aa1a0a0d464efdb3ad8c0fb1f8a4dfb27a8c489b609920c
  #   container_name: plex
  #   profiles:
  #     - media-servers-disabled
  #   network_mode: host
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=America/New_York
  #     - PLEX_CLAIM= # Optional: add your Plex claim token here
  #   devices:
  #     - /dev/dri/renderD128:/dev/dri/renderD128
  #     - /dev/dri/card1:/dev/dri/card1
  #   group_add:
  #     - "992" # render group
  #     - "44" # video group
  #   volumes:
  #     - /opt/appdata/plex:/config
  #     - ${ARRPATH}Radarr/movies:/data/Movies
  #     - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
  #     - ${ARRPATH}Sonarr/tvseries:/data/TVShows
  #     - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
  #     - ${ARRPATH}Lidarr/music:/data/Music
  #   restart: unless-stopped
  #   env_file:
  #     - ".env"

  # SEERR (formerly Jellyseerr/Overseerr)

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    hostname: seerr
    ports:
      - "5055:5055"
    volumes:
      - /opt/appdata/seerr:/app/config
      - ${ARRPATH}Radarr/movies:/data/Movies # Allow importing/requesting files
      - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
      - ${ARRPATH}Sonarr/tvseries:/data/TVShows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ".env"
    restart: unless-stopped

  #  qBittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:474ef1f1c63fc060236e85cd6ec4a3232aea5a0d7a033c6bab9911039933f147
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - WEBUI_PORT=8080
    volumes:
      - /opt/appdata/qbittorrent:/config
      - ${ARRPATH}qbittorrent/downloads:/data/downloads
    restart: unless-stopped
    env_file:
      - ".env"

  tdarr:
    container_name: tdarr
    hostname: tdarr
    image: ghcr.io/haveagitgat/tdarr_acc:latest 
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8265:8265 # web UI
      - 8266:8266 # server port
    environment:
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
      - auth=false
      - openBrowser=true
      - maxLogSizeMB=10
      - cronPluginUpdate=
      # NVIDIA_DRIVER_CAPABILITIES removed; using only Intel Quick Sync
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - /opt/appdata/tdarr/logs:/app/logs
      - ${ARRPATH}:/media
      - /transcode_cache:/temp
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync
      # NVIDIA devices removed; using only Intel Quick Sync
    env_file:
      - ".env"

  # AUTOMATIC RIPPING MACHINE (ARM)
  arm-rippers:
    image: 1337server/automatic-ripping-machine:latest
    container_name: arm-rippers
    ports:
      - "8090:8080"
    volumes:
      - /opt/appdata/arm-home:/home/arm
      - ${ARRPATH}ARM/Music:/home/arm/Music
      - ${ARRPATH}ARM/logs:/home/arm/logs
      - ${ARRPATH}ARM/media:/home/arm/media
      - /opt/appdata/arm:/etc/arm/config
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
      - /dev/sr2:/dev/sr2
      - /dev/sr3:/dev/sr3
    privileged: true
    restart: always
    env_file:
      - ".env"

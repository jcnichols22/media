services:
  # GLUETUN (ProtonVPN)

  gluetun:
    image: qmcgaw/gluetun@sha256:183c74263a07f4c931979140ac99ff4fbc44dcb1ca5b055856ef580b0fafdf1c
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${PROTONVPN_WG_ADDRESSES}
      - WIREGUARD_ENDPOINT_IP=${PROTONVPN_WG_ENDPOINT_IP}
      - WIREGUARD_PUBLIC_KEY=${PROTONVPN_WG_PUBLIC_KEY}
      - WIREGUARD_ALLOWED_IPS=${PROTONVPN_WG_ALLOWED_IPS}
      - WIREGUARD_DNS=${PROTONVPN_WG_DNS}
      - FIREWALL_INPUT_PORTS=8080,6881
      - DOT=off
      - TZ=${TZ}
    ports:
      - 8080:8080 # qBittorrent WebUI
      - 6881:6881 # qBittorrent TCP
      - 6881:6881/udp # qBittorrent UDP
    healthcheck:
      test: [ "CMD", "/gluetun-entrypoint", "healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    env_file:
      - ".env"
  # PROWLARR

  prowlarr:
    image: linuxserver/prowlarr@sha256:35f48abb3e976fcf077fae756866c582e4a90f8b24810ae4067b3558f7cdbbdf
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - /opt/appdata/prowlarr:/config
      - ${ARRPATH}Prowlarr/backup:/data/Backup
      - ${ARRPATH}qbittorrent/downloads:/downloads

    ports:
      - 9696:9696
    restart: unless-stopped
    env_file:
      - ".env"

  # FLARESOLVERR (Cloudflare bypass proxy for indexers)

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    container_name: flaresolverr
    hostname: flaresolverr
    ports:
      - 8191:8191
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - /opt/appdata/flaresolverr:/config
    restart: unless-stopped
    env_file:
      - ".env"

  # PROFILARR (Sync arr custom formats/profiles)

  profilarr:
    image: santiagosayshey/profilarr@sha256:8a514f8429cd33885166facc9eb6504fa9ded056c737609e5e8ef32ae0afb350
    container_name: profilarr
    hostname: profilarr
    ports:
      - 6868:6868
    volumes:
      - /opt/appdata/profilarr:/config
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    env_file:
      - ".env"

  # JELLYPLEX-WATCHED (Sync Jellyfin <-> Plex watch history)

  jellyplex-watched:
    image: ghcr.io/luigi311/jellyplex-watched@sha256:e7d37b649ba8c92eca16f9f4a97e0c3ceabf326bd9f1dbe59cd44f13d2875afd
    container_name: jellyplex-watched
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    restart: unless-stopped
    env_file:
      - ".env"

  # Bazarr

  bazarr:
    image: linuxserver/bazarr@sha256:21a4813c5ba120d72ac5f54869b790792bda0784205268eccbc204adb6dbe485
    container_name: bazarr
    hostname: bazarr
    volumes:
      - /opt/appdata/bazarr:/config
      - ${ARRPATH}Sonarr/tvseries:/data/tvshows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/anime-tvshows
      - ${ARRPATH}Radarr/movies:/data/movies
      - ${ARRPATH}Radarr/anime-movies:/data/anime-movies
    ports:
      - 6767:6767
    restart: unless-stopped
    env_file:
      - ".env"

  # SONARR

  sonarr:
    image: linuxserver/sonarr@sha256:6854df9de20b8c82e1982604f39473d64dbb4c4584b1013f18f9ade1ee92af13
    container_name: sonarr
    hostname: sonarr
    volumes:
      - /opt/appdata/sonarr:/config
      - ${ARRPATH}Sonarr/backup:/data/Backup
      - ${ARRPATH}Sonarr/tvseries:/data/tvshows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/anime-tvshows
      - ${ARRPATH}qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    env_file:
      - ".env"

  # RADARR

  radarr:
    image: linuxserver/radarr@sha256:cd70546fc97169788530386b42cf47ba1b16d091b4dc2264cd54099dd13c6f7f
    container_name: radarr
    hostname: radarr
    volumes:
      - /opt/appdata/radarr:/config
      - ${ARRPATH}Radarr/movies:/data/movies
      - ${ARRPATH}Radarr/anime-movies:/data/anime-movies
      - ${ARRPATH}Radarr/backup:/data/Backup
      - ${ARRPATH}qbittorrent/downloads:/downloads
      - ${ARRPATH}ARM/media/completed/movies:/arm-completed
    ports:
      - 7878:7878
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    env_file:
      - ".env"

  # JELLYFIN

  jellyfin:
    image: linuxserver/jellyfin@sha256:e93bc100c6da07bd058678e4b634e4e71031fe840227e2ed03a1104f032bebe8
    container_name: jellyfin
    ports:
      - "8096:8096/tcp" # Jellyfin web interface
      - "7359:7359/udp" # Network discovery
      - "1900:1900/udp" # DLNA port
    volumes:
      - /opt/appdata/jellyfin:/config
      - ${ARRPATH}Radarr/movies:/data/Movies
      - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
      - ${ARRPATH}Sonarr/tvseries:/data/TVShows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
      - ${ARRPATH}Lidarr/music:/data/Music
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "992" # render group
      - "44" # video group
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.0.34 #optional
    env_file:
      - ".env"
    restart: unless-stopped

  # PLEX

  plex:
    image: plexinc/pms-docker@sha256:8b5bcdf7b506fe051aa1a0a0d464efdb3ad8c0fb1f8a4dfb27a8c489b609920c
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PLEX_CLAIM= # Optional: add your Plex claim token here
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    group_add:
      - "992" # render group
      - "44" # video group
    volumes:
      - /opt/appdata/plex:/config
      - ${ARRPATH}Radarr/movies:/data/Movies
      - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
      - ${ARRPATH}Sonarr/tvseries:/data/TVShows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
      - ${ARRPATH}Lidarr/music:/data/Music
    restart: unless-stopped
    env_file:
      - ".env"

  # SEERR (formerly Jellyseerr/Overseerr)

  seerr:
    image: ghcr.io/seerr-team/seerr@sha256:b35ba0461c4a1033d117ac1e5968fd4cbe777899e4cbfbdeaf3d10a42a0eb7e9
    container_name: seerr
    hostname: seerr
    ports:
      - "5055:5055"
    volumes:
      - /opt/appdata/seerr:/app/config
      - ${ARRPATH}Jellyfin/config:/app/jellyfin # optional read-only mapping to let Seerr read Jellyfin's config
      - ${ARRPATH}Radarr/movies:/data/Movies # Allow importing/requesting files
      - ${ARRPATH}Radarr/anime-movies:/data/AnimeMovies
      - ${ARRPATH}Sonarr/tvseries:/data/TVShows
      - ${ARRPATH}Sonarr/anime-tvshows:/data/AnimeTVShows
      - ${ARRPATH}Lidarr/music:/data/Music # If music requests supported (optional)
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ".env"
    restart: unless-stopped

  #  qBittorrent

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:474ef1f1c63fc060236e85cd6ec4a3232aea5a0d7a033c6bab9911039933f147
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /opt/appdata/qbittorrent:/config
      - ${ARRPATH}qbittorrent/downloads:/downloads
    restart: unless-stopped
    env_file:
      - ".env"

  tdarr:
    container_name: tdarr
    hostname: tdarr
    image: ghcr.io/haveagitgat/tdarr_acc@sha256:db9520315f83974cb5b8f2a8ed89a8a2be3d97d29575f54cbe4b5cc5e6daf5a5 # Intel QuickSync enabled image
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8265:8265 # web UI
      - 8266:8266 # server port
    environment:
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=MyInternalNode
      - auth=false
      - openBrowser=true
      - maxLogSizeMB=10
      - cronPluginUpdate=
      # NVIDIA_DRIVER_CAPABILITIES removed; using only Intel Quick Sync
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - /opt/appdata/tdarr/logs:/app/logs
      - ${ARRPATH}:/media
      - /transcode_cache:/temp
    devices:
      - /dev/dri:/dev/dri # Intel Quick Sync
      # NVIDIA devices removed; using only Intel Quick Sync
    env_file:
      - ".env"

  # AUTOMATIC RIPPING MACHINE (ARM)
  arm-rippers:
    image: 1337server/automatic-ripping-machine@sha256:61275b5edebe634235ac35508c063749ee9116a6ecf88bad9470e410f18aafd1
    container_name: arm-rippers
    ports:
      - "8090:8080"
    volumes:
      - /opt/appdata/arm-home:/home/arm
      - ${ARRPATH}ARM/Music:/home/arm/Music
      - ${ARRPATH}ARM/logs:/home/arm/logs
      - ${ARRPATH}ARM/media:/home/arm/media
      - /opt/appdata/arm:/etc/arm/config
    devices:
      - /dev/sr0:/dev/sr0
      - /dev/sr1:/dev/sr1
      - /dev/sr2:/dev/sr2
      - /dev/sr3:/dev/sr3
    privileged: true
    restart: always
    env_file:
      - ".env"
